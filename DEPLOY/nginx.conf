limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

upstream idp_backend {
    server idp_service:8001;
}

upstream resource_backend {
    server resource_server:8002;
}

server {
    listen 443 ssl;
    server_name matma2026.gamer.gd;
    
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_certificate /etc/nginx/certs/certificate.crt;
    ssl_certificate_key /etc/nginx/certs/private.key;
    
    # Kích hoạt mTLS
    ssl_client_certificate /etc/nginx/certs/ca.crt; 
    ssl_verify_client on; 
    ssl_verify_depth 2;
    
    large_client_header_buffers 4 32k;

    # Shared proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
    proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
    proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;

    # Layer 2: Identity Provider (IdP)
    location /users {
        proxy_pass http://idp_backend;
    }

    location /api/v1/enable-2fa {
        proxy_pass http://idp_backend;
    }

    location /api/v1/verify-2fa {
        proxy_pass http://idp_backend;
    }

    # Layer 3: Resource Server
    location /api/v1/users/ {
        proxy_pass http://resource_backend;
    }

    location /api/v1/logout {
        proxy_pass http://resource_backend;
    }

    location /api/v1/test-cert {
        proxy_pass http://resource_backend;
    }

    # Default rate limiting
    limit_req zone=api_limit burst=20 nodelay;
    limit_req_status 429;
}
